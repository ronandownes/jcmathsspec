<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Two Distinct Points Determine a Unique Line</title>
<style>
:root{--blue:#1565c0;--red:#d32f2f;--ink:#202936;--muted:#657084;--bg:#f3f6fa;--panel:#fff;--grid:#e7ecf3;--border:#cbd4df}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{overscroll-behavior:none}
.app{max-width:760px;margin:auto;padding:8px;min-height:100dvh}
h1{font-size:clamp(1.3rem,6vw,2rem);line-height:1.08;margin:3px 0 5px}
.instructions{margin:0 0 8px;color:var(--muted);font-size:.95rem;line-height:1.35}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 8px 22px rgba(25,38,58,.08)}
svg{width:100%;height:min(62dvh,520px);min-height:340px;display:block;border:2px solid #9aa7b7;border-radius:10px;touch-action:none;user-select:none;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;overflow:hidden}
.line{stroke:#26313d;stroke-width:4;stroke-linecap:butt}
.point{stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.a{fill:var(--blue)}.b{fill:var(--red)}
.label{font-size:30px;font-weight:850;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.la{fill:var(--blue)}.lb{fill:var(--red)}
.status{margin-top:8px;padding:10px;border-radius:10px;background:#f3f6f9;border-left:5px solid var(--blue);font-size:.92rem;line-height:1.35;font-weight:650}
button{width:100%;margin-top:8px;border:0;border-radius:9px;padding:10px;background:#e8edf4;color:var(--ink);font:inherit;font-weight:760}
.conclusion{display:none;margin-top:8px;padding:12px;border:2px solid #27313e;border-radius:10px;text-align:center;font-size:1rem;font-weight:850}
.conclusion.visible{display:block}
@media(max-height:700px){svg{height:54dvh;min-height:285px}.status,.conclusion{padding:8px;font-size:.87rem}}
</style>
</head>
<body>
<main class="app">
<h1>Two Distinct Points Determine a Unique Line</h1>
<p class="instructions">Tap once to place A. Tap again to place B.</p>
<section class="card">
<svg id="board" viewBox="0 0 900 520" aria-label="Tap to place points A and B and form their unique straight line">
<line id="mainLine" class="line" visibility="hidden"></line>
<circle id="A" class="point a" r="24" visibility="hidden"></circle>
<circle id="B" class="point b" r="24" visibility="hidden"></circle>
<text id="labelA" class="label la" visibility="hidden">A</text>
<text id="labelB" class="label lb" visibility="hidden">B</text>
</svg>
<div id="status" class="status">Tap anywhere in the frame to place point A.</div>
<button id="reset" type="button">Start again</button>
<div id="conclusion" class="conclusion">Conclusion: Two distinct points determine a unique straight line.</div>
</section>
</main>
<script>
const svg=document.getElementById('board');
const mainLine=document.getElementById('mainLine');
const Ael=document.getElementById('A');
const Bel=document.getElementById('B');
const labelA=document.getElementById('labelA');
const labelB=document.getElementById('labelB');
const status=document.getElementById('status');
const conclusion=document.getElementById('conclusion');
const W=900,H=520,M=34,MIN_AB=110;
let stage=0,A=null,B=null;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const distance=(p,q)=>Math.hypot(q.x-p.x,q.y-p.y);
function pointer(e){const r=svg.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,M,W-M),y:clamp((e.clientY-r.top)*H/r.height,M,H-M)}}
function setPoint(el,label,p){el.setAttribute('cx',p.x);el.setAttribute('cy',p.y);el.setAttribute('visibility','visible');label.setAttribute('x',p.x+21);label.setAttribute('y',p.y-20);label.setAttribute('visibility','visible')}
function drawLine(){
  const dx=B.x-A.x;
  const dy=B.y-A.y;
  const length=Math.hypot(dx,dy);
  const ux=dx/length;
  const uy=dy/length;
  const extension=2000;
  mainLine.setAttribute('x1',A.x-ux*extension);
  mainLine.setAttribute('y1',A.y-uy*extension);
  mainLine.setAttribute('x2',A.x+ux*extension);
  mainLine.setAttribute('y2',A.y+uy*extension);
  mainLine.setAttribute('visibility','visible');
}
svg.addEventListener('pointerdown',e=>{const p=pointer(e);if(stage===0){A=p;setPoint(Ael,labelA,A);stage=1;status.innerHTML='<strong>Point A placed.</strong> Tap a different position to place point B.';return}if(stage===1){if(distance(A,p)<MIN_AB){status.innerHTML='<strong>A and B must be distinct.</strong> Tap farther away from A.';return}B=p;setPoint(Bel,labelB,B);drawLine();stage=2;status.innerHTML='<strong>The straight line through A and B extends to both borders of the frame.</strong>';conclusion.classList.add('visible')}});
document.getElementById('reset').addEventListener('click',()=>{stage=0;A=null;B=null;[Ael,Bel,labelA,labelB].forEach(el=>el.setAttribute('visibility','hidden'));mainLine.setAttribute('visibility','hidden');conclusion.classList.remove('visible');status.textContent='Tap anywhere in the frame to place point A.'});
</script>
</body>
</html>
