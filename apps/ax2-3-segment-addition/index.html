<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segment addition</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0}main{max-width:700px;margin:auto;padding:12px}h1{text-align:center}.card{background:white;padding:16px;border-radius:16px}.diagram{font-size:2rem;text-align:center;margin:24px 0}.values{text-align:center;font-size:1.25rem;font-weight:800}.learn{margin-top:14px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}input{width:100%}button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Do the parts still make the whole?</h1><div class="card"><p style="text-align:center;font-weight:800">Move C.</p><div class="diagram"><span style="color:#1565c0">A</span> ─── <span style="color:#2e7d32">C</span> ─── <span style="color:#d32f2f">B</span></div><input id="slider" type="range" min="0" max="76" value="38"><div id="values" class="values"></div><div class="learn"><b>What we learned</b><p>The two parts make the whole.</p><p><b>AC + CB = AB</b></p></div><button id="reset">Start Again</button></div></main><script>const s=document.getElementById('slider'),v=document.getElementById('values');function draw(){let x=Number(s.value)/10;v.textContent='AC = '+x.toFixed(1)+' + CB = '+(7.6-x).toFixed(1)+' = AB = 7.6'}s.oninput=draw;reset.onclick=()=>{s.value=38;draw()};draw()</script></body></html>
