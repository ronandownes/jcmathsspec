<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom 2 — Ruler Axiom: Segment Addition</title><style>:root{--blue:#1565c0;--red:#d32f2f;--green:#2e7d32}*{box-sizing:border-box}body{font-family:system-ui;background:#f4f6f8;margin:0;color:#1f2937}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:1.55rem}.card{background:#fff;padding:14px;border-radius:16px}.top{text-align:center;font-weight:800}.board{position:relative;width:100%;aspect-ratio:1/1;max-height:62dvh;border:2px solid #98a2b3;border-radius:12px;background:#fff;touch-action:none;overflow:hidden}.seg{position:absolute;height:3px;background:#111;transform-origin:0 50%;pointer-events:none}.p{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 3px #777;touch-action:none}.a{background:var(--blue)}.b{background:var(--red)}.c{background:var(--green)}.lab{position:absolute;transform:translate(-50%,-145%);font-weight:900;pointer-events:none}.values{text-align:center;font-size:1.05rem;font-weight:850;margin:10px 0}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}.show{display:block}button{width:100%;margin:8px 0 10px;padding:11px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Axiom 2 — Ruler Axiom</h1><div class="card"><p class="top">Move A and B. Drag C along the segment.</p><button id="reset">Reset</button><div id="values" class="values"></div><div id="board" class="board"><div id="ab" class="seg"></div><div id="la" class="lab" style="color:#1565c0">A</div><div id="lb" class="lab" style="color:#d32f2f">B</div><div id="lc" class="lab" style="color:#2e7d32">C</div><div id="a" class="p a"></div><div id="b" class="p b"></div><div id="c" class="p c"></div></div><div id="learn" class="learn"><strong>Axiom 2 — Ruler Axiom</strong><p>If C lies on AB, between A and B, then</p><p><b>|AB| = |AC| + |CB|</b></p></div></div></main><script>const board=document.querySelector('#board'),a=document.querySelector('#a'),b=document.querySelector('#b'),c=document.querySelector('#c'),la=document.querySelector('#la'),lb=document.querySelector('#lb'),lc=document.querySelector('#lc'),ab=document.querySelector('#ab'),values=document.querySelector('#values'),learn=document.querySelector('#learn');let A={x:.2,y:.3},B={x:.8,y:.7},t=.5,active,moves=0;const C=()=>({x:A.x+t*(B.x-A.x),y:A.y+t*(B.y-A.y)});function pos(e){const r=board.getBoundingClientRect();return{x:Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width)),y:Math.max(.03,Math.min(.97,(e.clientY-r.top)/r.height))}}function project(p){const dx=B.x-A.x,dy=B.y-A.y,den=dx*dx+dy*dy;t=Math.max(0,Math.min(1,den?((p.x-A.x)*dx+(p.y-A.y)*dy)/den:0))}function draw(){const r=board.getBoundingClientRect(),P=C(),dx=(B.x-A.x)*r.width,dy=(B.y-A.y)*r.height,dAB=Math.hypot(dx,dy)/r.width*10,dAC=dAB*t,dCB=dAB*(1-t);for(const [el,p] of [[a,A],[la,A],[b,B],[lb,B],[c,P],[lc,P]]){el.style.left=p.x*100+'%';el.style.top=p.y*100+'%'}ab.style.left=A.x*100+'%';ab.style.top=A.y*100+'%';ab.style.width=Math.hypot(dx,dy)+'px';ab.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';values.textContent='|AB| = '+dAB.toFixed(1)+'   |AC| = '+dAC.toFixed(1)+'   |CB| = '+dCB.toFixed(1);if(moves>1)learn.classList.add('show')}function move(e){if(!active)return;const p=pos(e);if(active===a)A=p;else if(active===b)B=p;else project(p);moves++;draw()}[a,b,c].forEach(el=>{el.onpointerdown=e=>{active=el;el.setPointerCapture(e.pointerId);move(e)};el.onpointermove=move;el.onpointerup=()=>active=null});reset.onclick=()=>{A={x:.2,y:.3};B={x:.8,y:.7};t=.5;moves=0;learn.classList.remove('show');draw()};addEventListener('resize',draw);draw()</script></body></html>
