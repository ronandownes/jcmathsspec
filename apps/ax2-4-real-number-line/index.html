<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinate line</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0}main{max-width:700px;margin:auto;padding:12px}.card{background:white;padding:16px;border-radius:16px}h1{text-align:center}.line{text-align:center;font-size:1.5rem;font-weight:900;margin:30px 0}.learn{margin-top:14px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Real numbers on a line</h1><div class="card"><p style="text-align:center;font-weight:800">Tap to reveal the two directions.</p><div id="line" class="line">&lt;------ 0 ------&gt;</div><button id="show">Reveal</button><div id="learn" class="learn"><b>What we learned</b><p id="text">One ray is positive. The other ray is negative.</p><p>The full line contains every real number.</p></div></div></main><script>show.onclick=()=>{line.textContent='<--- -3 -2 -1  0  1 2 3 --->'}</script></body></html>
