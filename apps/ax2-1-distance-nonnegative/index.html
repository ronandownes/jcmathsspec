<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance is non-negative</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#1f2937}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center}.card{background:white;padding:14px;border-radius:16px}.line{position:relative;height:180px;border:2px solid #98a2b3;border-radius:12px;touch-action:none}.axis{position:absolute;left:5%;right:5%;top:50%;height:4px;background:#111}.p{position:absolute;top:50%;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid white;touch-action:none}.a{background:#1565c0}.b{background:#d32f2f}.lab{position:absolute;top:35%;transform:translateX(-50%);font-weight:900}.read{text-align:center;font-size:1.5rem;font-weight:900;margin:10px}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}.show{display:block}button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Can distance be negative?</h1><div class="card"><p style="text-align:center;font-weight:800">Drag A and B.</p><div id="r" class="read"></div><div id="line" class="line"><div class="axis"></div><div id="la" class="lab">A</div><div id="lb" class="lab">B</div><div id="a" class="p a"></div><div id="b" class="p b"></div></div><div id="learn" class="learn"><strong>What we learned</strong><p>Distance is <b>non-negative</b>.</p><p>It can be zero, but never negative: <b>d ≥ 0</b>.</p></div><button id="reset">Start Again</button></div></main><script>const line=document.querySelector('#line'),a=document.querySelector('#a'),b=document.querySelector('#b'),la=document.querySelector('#la'),lb=document.querySelector('#lb'),r=document.querySelector('#r'),learn=document.querySelector('#learn');let x=.3,y=.7,active,m=0;function draw(){a.style.left=la.style.left=x*100+'%';b.style.left=lb.style.left=y*100+'%';r.textContent='Distance = '+(Math.abs(y-x)*10).toFixed(1);if(m>1)learn.classList.add('show')}function p(e){let q=line.getBoundingClientRect();return Math.max(.05,Math.min(.95,(e.clientX-q.left)/q.width))}function move(e){if(!active)return;active===a?x=p(e):y=p(e);m++;draw()}[a,b].forEach(z=>{z.onpointerdown=e=>{active=z;z.setPointerCapture(e.pointerId);move(e)};z.onpointermove=move;z.onpointerup=()=>active=null});reset.onclick=()=>{x=.3;y=.7;m=0;learn.classList.remove('show');draw()};draw()</script></body></html>
