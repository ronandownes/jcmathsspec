<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance is non-negative</title><style>:root{--blue:#1565c0;--red:#d32f2f;--ink:#1f2937;--bg:#f4f6f8;--green:#eef7ee;--green-border:#8fbf91}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:clamp(1.45rem,5vw,2rem);margin:5px 0 10px}.card{background:#fff;padding:14px;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08)}.prompt{text-align:center;font-weight:800;margin:0 0 8px}.read{text-align:center;font-size:1.45rem;font-weight:900;margin:8px}.board{width:min(100%,520px);aspect-ratio:1/1;margin:auto;display:block;background:#fff;border:2px solid #98a2b3;border-radius:12px;touch-action:none}.segment{stroke:#111827;stroke-width:5}.point{stroke:#fff;stroke-width:4;cursor:grab}.a{fill:var(--blue)}.b{fill:var(--red)}.label{font-size:34px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}.la{fill:var(--blue)}.lb{fill:var(--red)}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:var(--green);border:2px solid var(--green-border);border-radius:12px}.learn.show{display:block}.learn p{margin:7px 0}button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:800;background:#e6ebf1}</style></head><body><main><h1>Can distance be negative?</h1><section class="card"><p class="prompt">Drag either point anywhere in the square.</p><div id="read" class="read"></div><svg id="board" class="board" viewBox="0 0 500 500" aria-label="Two draggable points in a square"><line id="segment" class="segment"/><circle id="a" class="point a" r="22"/><circle id="b" class="point b" r="22"/><text id="la" class="label la">A</text><text id="lb" class="label lb">B</text></svg><section id="learn" class="learn" aria-live="polite"><strong>What we learned</strong><p>Distance is <b>non-negative</b>.</p><p>It can be zero, but never negative: <b>AB ≥ 0</b>.</p></section><button id="reset" type="button">Start Again</button></section></main><script>const board=document.getElementById('board'),A=document.getElementById('a'),B=document.getElementById('b'),LA=document.getElementById('la'),LB=document.getElementById('lb'),segment=document.getElementById('segment'),read=document.getElementById('read'),learn=document.getElementById('learn'),reset=document.getElementById('reset');let pA={x:150,y:250},pB={x:350,y:250},active=null,moves=0;const clamp=v=>Math.max(24,Math.min(476,v));function pos(e){const r=board.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*500/r.width),y:clamp((e.clientY-r.top)*500/r.height)}}function draw(){for(const [p,c,l] of [[pA,A,LA],[pB,B,LB]]){c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);l.setAttribute('x',p.x+25);l.setAttribute('y',p.y-23)}segment.setAttribute('x1',pA.x);segment.setAttribute('y1',pA.y);segment.setAttribute('x2',pB.x);segment.setAttribute('y2',pB.y);const d=Math.hypot(pB.x-pA.x,pB.y-pA.y)/40;read.textContent='Distance = '+d.toFixed(1);if(moves>1)learn.classList.add('show')}function move(e){if(!active)return;const p=pos(e);if(active===A)pA=p;else pB=p;moves++;draw()}[A,B].forEach(c=>{c.addEventListener('pointerdown',e=>{active=c;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',move);c.addEventListener('pointerup',()=>active=null);c.addEventListener('pointercancel',()=>active=null)});reset.addEventListener('click',()=>{pA={x:150,y:250};pB={x:350,y:250};moves=0;learn.classList.remove('show');draw()});draw()</script></body></html>
