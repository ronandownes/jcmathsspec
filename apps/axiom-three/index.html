<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Discover Axiom 3 · Protractor</title>
<style>
:root{--blue:#1565c0;--red:#d32f2f;--green:#2e9d50;--ink:#1f2937;--muted:#667085;--line:#cbd5e1;--bg:#f4f7fb;--gold:#e69a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:8px}h1{text-align:center;font-size:clamp(1.4rem,6vw,2rem);margin:4px 0}.sub{text-align:center;color:var(--muted);margin:0 0 8px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}.prompt,.info{padding:10px;border-radius:10px;margin-top:8px;line-height:1.4}.prompt{background:#fff8db;border:1px solid #e5cd69;font-weight:800}.info{background:#eef6ff;border-left:5px solid var(--blue)}.hidden{display:none!important}svg{width:100%;height:min(52dvh,430px);min-height:310px;display:block;border:2px solid #9aa7b7;border-radius:10px;background:#fff;touch-action:none}.ray{stroke-width:7;stroke-linecap:round}.base{stroke:var(--blue)}.moving{stroke:var(--red)}.divider{stroke:var(--green)}.pt{stroke:#fff;stroke-width:3}.lab{font-size:27px;font-weight:850;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}.arc{fill:none;stroke:var(--gold);stroke-width:5}.part{fill:none;stroke:var(--green);stroke-width:5}.readout{text-align:center;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:1.2rem;font-weight:900}.readout small{display:block;color:var(--muted);font-size:.75rem}.buttons{display:flex;gap:6px;margin-top:8px}.buttons button,.next{flex:1;border:0;border-radius:9px;padding:11px 6px;font:inherit;font-weight:800;background:#e8edf4}.buttons button.active{outline:3px solid #9dbce3}.next{width:100%;margin-top:8px}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.partbox{text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px;font-weight:850}.partbox small{display:block;color:var(--muted);font-weight:600}@media(max-width:450px){.app{padding:5px}.card{padding:6px}.parts{grid-template-columns:1fr}.buttons button{font-size:.88rem}}
</style>
</head>
<body><main class="app"><h1>Discover Axiom 3 · Protractor</h1><p class="sub">Discover angle measure by turning and partitioning.</p><section class="card">
<div id="prompt" class="prompt">What is the biggest angle you can show? Drag red C all the way around A.</div>
<svg id="board" viewBox="0 0 760 500"><path id="arc" class="arc"></path><path id="arc1" class="part hidden"></path><path id="arc2" class="arc hidden"></path><line id="AB" class="ray base"></line><line id="AC" class="ray moving"></line><line id="AD" class="ray divider hidden"></line><circle id="A" class="pt" r="20" fill="#1f2937"></circle><circle id="B" class="pt" r="20" fill="#1565c0"></circle><circle id="C" class="pt" r="22" fill="#d32f2f"></circle><circle id="D" class="pt hidden" r="20" fill="#2e9d50"></circle><text id="la" class="lab" fill="#1f2937">A</text><text id="lb" class="lab" fill="#1565c0">B</text><text id="lc" class="lab" fill="#d32f2f">C</text><text id="ld" class="lab hidden" fill="#2e9d50">D</text></svg>
<div id="readout" class="readout">60°<small>angle measure</small></div>
<div id="senseButtons" class="buttons hidden"><button id="anti">Anticlockwise</button><button id="clock">Clockwise</button></div>
<div id="parts" class="parts hidden"><div id="whole" class="partbox"></div><div id="first" class="partbox"></div><div id="second" class="partbox"></div></div>
<div id="info" class="info hidden"></div><button id="next" class="next hidden">Continue</button><button id="reset" class="next">Start again</button>
</section></main>
<script>
const $=id=>document.getElementById(id),svg=$('board'),O={x:380,y:250},R=190;let stage=0,theta=60,shown=60,turn=60,last=60,drag=null,sense='anti',divider=38,found360=false;
const rad=d=>d*Math.PI/180,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function p(d,r=R){return{x:O.x+r*Math.cos(rad(d)),y:O.y-r*Math.sin(rad(d))}}
function setP(id,l,q){$(id).setAttribute('cx',q.x);$(id).setAttribute('cy',q.y);$(l).setAttribute('x',q.x+15);$(l).setAttribute('y',q.y-14)}
function setL(id,a,b){let e=$(id);e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y)}
function path(a,b,r){let x=p(a,r),y=p(b,r),span=b-a;return`M ${x.x} ${x.y} A ${r} ${r} 0 ${span>180?1:0} 0 ${y.x} ${y.y}`}
function circle(r){return path(0,180,r)+' '+path(180,359.999,r)}
function show(ids,on=true){ids.forEach(id=>$(id).classList.toggle('hidden',!on))}
function raw(q){let a=Math.atan2(O.y-q.y,q.x-O.x)*180/Math.PI;return a<0?a+360:a}
function ordinary(a){a=((a%360)+360)%360;return a<=180?a:360-a}
function render(){setP('A','la',O);setP('B','lb',p(0));setP('C','lc',p(theta));setL('AB',O,p(0));setL('AC',O,p(theta));
 if(stage===0){$('arc').setAttribute('d',shown===360?circle(82):(shown===0?'':path(0,shown,82)));$('readout').innerHTML=`${Math.round(shown)}°<small>angle measure</small>`}
 if(stage===1){let anti=((theta%360)+360)%360,clock=(360-anti)%360,val=sense==='anti'?anti:clock;$('arc').setAttribute('d',val===0?'':sense==='anti'?path(0,anti,82):path(theta,360,82));$('readout').innerHTML=`${Math.round(val)}°<small>${sense==='anti'?'anticlockwise':'clockwise'} sense</small>`;$('anti').classList.toggle('active',sense==='anti');$('clock').classList.toggle('active',sense==='clock')}
 if(stage===2){let a=ordinary(theta);theta=a;$('arc').setAttribute('d',a===0?'':path(0,a,82));$('readout').innerHTML=`|∠BAC| = ${Math.round(a)}°<small>ordinary angle unless reflex is explicitly stated</small>`}
 if(stage===3){let a=theta,D=p(divider);setP('D','ld',D);setL('AD',O,D);$('arc').setAttribute('d','');$('arc1').setAttribute('d',path(0,divider,82));$('arc2').setAttribute('d',path(divider,a,105));$('whole').innerHTML=`${Math.round(a)}°<small>|∠BAC| whole</small>`;$('first').innerHTML=`${Math.round(divider)}°<small>|∠BAD|</small>`;$('second').innerHTML=`${Math.round(a-divider)}°<small>|∠DAC|</small>`}}
function pointer(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*760/r.width,y:(e.clientY-r.top)*500/r.height}}
svg.addEventListener('pointerdown',e=>{let q=pointer(e);if(stage<3&&Math.hypot(q.x-p(theta).x,q.y-p(theta).y)<75)drag='C';if(stage===3&&Math.hypot(q.x-p(divider).x,q.y-p(divider).y)<75)drag='D';if(drag){last=raw(q);svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{if(!drag)return;let a=raw(pointer(e));if(drag==='C'&&stage===0){let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;turn+=d;theta=a;if(turn>=359.5&&!found360){found360=true;shown=360;show(['info','next']);$('info').innerHTML='<strong>Discovery:</strong> 360° is one complete turn. Keep going: the display starts again at 1°, 2°, 3° — never 361°.'}else if(found360&&turn>360)shown=((turn%360)+360)%360;else shown=clamp(turn,0,360);last=a;render()}else if(drag==='C'&&stage===1){theta=a;render()}else if(drag==='D'&&stage===3){divider=clamp(ordinary(a),1,theta-1);render()}});
function stop(e){drag=null;try{svg.releasePointerCapture(e.pointerId)}catch{}}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
$('next').onclick=()=>{if(stage===0){stage=1;theta=70;sense='anti';show(['senseButtons'],true);$('prompt').textContent='Two senses: the same final ray can be reached by turning anticlockwise or clockwise.';$('info').innerHTML='Switch sense. For this position the two turn measures add to 360°.';$('next').textContent='Assume ordinary angle';render()}else if(stage===1){stage=2;theta=70;show(['senseButtons'],false);$('prompt').textContent='Convention: unless reflex is explicitly stated, assume the ordinary angle.';$('info').innerHTML='<strong>Ordinary angle:</strong> use the non-reflex angle between the rays. Its measure is less than 180°. A straight angle is 180°.';$('next').textContent='Partition the angle';render()}else if(stage===2){stage=3;theta=110;divider=38;show(['D','ld','AD','arc1','arc2','parts'],true);$('prompt').textContent='Partition ∠BAC. Drag green D inside the angle. What is conserved?';$('info').innerHTML='<strong>Conservation under partitioning:</strong> one part grows as the other shrinks, but their sum remains the whole angle.';$('next').textContent='Show conclusion';render()}else{$('info').innerHTML='<strong>Axiom 3:</strong> If D is inside ∠BAC, then |∠BAC| = |∠BAD| + |∠DAC|.';show(['next'],false)}};
$('anti').onclick=()=>{sense='anti';render()};$('clock').onclick=()=>{sense='clock';render()};
$('reset').onclick=()=>{stage=0;theta=60;shown=60;turn=60;last=60;drag=null;sense='anti';divider=38;found360=false;show(['senseButtons','parts','D','ld','AD','arc1','arc2','info','next'],false);$('prompt').textContent='What is the biggest angle you can show? Drag red C all the way around A.';$('next').textContent='Continue';render()};render();
</script></body></html>
