<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom 2 — Ruler Axiom: Symmetry</title><style>:root{--blue:#1565c0;--red:#d32f2f;--green:#2e7d32}*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4f6f8;color:#1f2937}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:1.55rem}.card{background:#fff;padding:14px;border-radius:16px}.top{text-align:center;font-weight:800}.board{position:relative;width:100%;aspect-ratio:1/1;max-height:62dvh;border:2px solid #98a2b3;border-radius:12px;background:#fff;touch-action:none;overflow:hidden}.seg{position:absolute;height:3px;background:#111;transform-origin:0 50%;pointer-events:none}.p{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 3px #777;touch-action:none}.a{background:var(--blue)}.b{background:var(--red)}.lab{position:absolute;transform:translate(-50%,-145%);font-weight:900;pointer-events:none}.read{text-align:center;font-size:1.35rem;font-weight:900;margin:10px}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}.show{display:block}button{width:100%;margin:8px 0 10px;padding:11px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Axiom 2 — Ruler Axiom</h1><div class="card"><p class="top">Move A and B. Does reversing the order change the distance?</p><button id="reset">Reset</button><div id="read" class="read"></div><div id="board" class="board"><div id="seg" class="seg"></div><div id="la" class="lab" style="color:#1565c0">A</div><div id="lb" class="lab" style="color:#d32f2f">B</div><div id="a" class="p a"></div><div id="b" class="p b"></div></div><div id="learn" class="learn"><strong>Axiom 2 — Ruler Axiom</strong><p><b>|AB| = |BA|</b></p></div></div></main><script>const board=document.querySelector('#board'),a=document.querySelector('#a'),b=document.querySelector('#b'),la=document.querySelector('#la'),lb=document.querySelector('#lb'),seg=document.querySelector('#seg'),read=document.querySelector('#read'),learn=document.querySelector('#learn');let A={x:.28,y:.32},B={x:.72,y:.68},active,moves=0;function pos(e){const r=board.getBoundingClientRect();return{x:Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width)),y:Math.max(.03,Math.min(.97,(e.clientY-r.top)/r.height))}}function draw(){const r=board.getBoundingClientRect(),dx=(B.x-A.x)*r.width,dy=(B.y-A.y)*r.height,d=Math.hypot(dx,dy)/r.width*10;for(const [el,p] of [[a,A],[la,A],[b,B],[lb,B]]){el.style.left=p.x*100+'%';el.style.top=p.y*100+'%'}seg.style.left=A.x*100+'%';seg.style.top=A.y*100+'%';seg.style.width=Math.hypot(dx,dy)+'px';seg.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';read.textContent='|AB| = '+d.toFixed(1)+'     |BA| = '+d.toFixed(1);if(moves>1)learn.classList.add('show')}function move(e){if(!active)return;Object.assign(active===a?A:B,pos(e));moves++;draw()}[a,b].forEach(el=>{el.onpointerdown=e=>{active=el;el.setPointerCapture(e.pointerId);move(e)};el.onpointermove=move;el.onpointerup=()=>active=null});reset.onclick=()=>{A={x:.28,y:.32};B={x:.72,y:.68};moves=0;learn.classList.remove('show');draw()};addEventListener('resize',draw);draw()</script></body></html>
