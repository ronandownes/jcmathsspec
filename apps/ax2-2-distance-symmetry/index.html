<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance is symmetric</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#1f2937}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center}.card{background:white;padding:14px;border-radius:16px}.line{position:relative;height:180px;border:2px solid #98a2b3;border-radius:12px}.axis{position:absolute;left:5%;right:5%;top:50%;height:4px;background:#111}.p{position:absolute;top:50%;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid white}.a{left:28%;background:#1565c0}.b{left:72%;background:#d32f2f}.lab{position:absolute;top:35%;transform:translateX(-50%);font-weight:900}.la{left:28%}.lb{left:72%}.read{text-align:center;font-size:1.35rem;font-weight:900;margin:10px}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:#eef7ee;border:2px solid #8fbf91;border-radius:12px}.show{display:block}button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;font-weight:800}</style></head><body><main><h1>Does order change distance?</h1><div class="card"><p style="text-align:center;font-weight:800">Tap Swap.</p><div id="read" class="read">AB = 4.4 &nbsp;&nbsp; BA = 4.4</div><div class="line"><div class="axis"></div><div id="la" class="lab la">A</div><div id="lb" class="lab lb">B</div><div id="a" class="p a"></div><div id="b" class="p b"></div></div><button id="swap">Swap A and B</button><div id="learn" class="learn"><strong>What we learned</strong><p>Changing the order does not change the distance.</p><p><b>AB = BA</b></p></div><button id="reset">Start Again</button></div></main><script>const a=document.querySelector('#a'),b=document.querySelector('#b'),la=document.querySelector('#la'),lb=document.querySelector('#lb'),learn=document.querySelector('#learn');let swapped=false;function draw(){let x=swapped?72:28,y=swapped?28:72;a.style.left=la.style.left=x+'%';b.style.left=lb.style.left=y+'%'}swap.onclick=()=>{swapped=!swapped;draw();learn.classList.add('show')};reset.onclick=()=>{swapped=false;learn.classList.remove('show');draw()};draw()</script></body></html>
