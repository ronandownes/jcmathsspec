<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Discover Axiom 2 · Distance</title>
<style>
:root{--blue:#1565c0;--red:#d32f2f;--green:#2e9d50;--ink:#202936;--muted:#657084;--bg:#f3f6fa;--panel:#fff;--border:#cbd4df}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{overscroll-behavior:none}.app{max-width:760px;margin:auto;padding:8px;min-height:100dvh}h1{font-size:clamp(1.35rem,6vw,2rem);line-height:1.08;margin:3px 0 4px}.subtitle{margin:0 0 8px;color:var(--muted);font-size:.94rem}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 8px 22px rgba(25,38,58,.08)}svg{width:100%;height:min(47dvh,420px);min-height:290px;display:block;border:2px solid #9aa7b7;border-radius:10px;touch-action:none;user-select:none;background:#fff}.segment{stroke:#26313d;stroke-width:6;stroke-linecap:round}.part-a{stroke:var(--blue);stroke-width:7}.part-b{stroke:var(--red);stroke-width:7}.point{stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));cursor:grab}.a{fill:var(--blue)}.b{fill:var(--red)}.c{fill:var(--green)}.label{font-size:28px;font-weight:850;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px}.la{fill:var(--blue)}.lb{fill:var(--red)}.lc{fill:var(--green)}.instruction,.result{margin-top:8px;padding:10px;border-radius:10px;font-size:.94rem;line-height:1.35;font-weight:700}.instruction{background:#f3f6f9;border-left:5px solid var(--blue)}.result{display:none;background:#fff8dc;border:1px solid #e6cf72}.result.visible{display:block}.readout{display:none;margin-top:8px;text-align:center;padding:9px;border:1px solid var(--border);border-radius:9px;font-weight:800}.readout.visible{display:block}.choices{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.choices.visible{display:grid}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}button,.back-link{border:0;border-radius:9px;padding:10px;font:inherit;font-weight:760;text-align:center;text-decoration:none}button{background:#e8edf4;color:var(--ink)}button.done{background:#dff2e4}.back-link{display:block;background:#eef2f6;color:var(--ink);border:1px solid var(--border);margin-top:8px}.keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.keyword{padding:5px 8px;border-radius:999px;background:#eef2f6;border:1px solid var(--border);font-size:.78rem;font-weight:750}@media(max-width:560px){.choices{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app">
<h1>Discover Axiom 2 · Distance</h1>
<p class="subtitle">Explore distance using endpoints and an intermediate point.</p>
<section class="card">
<svg id="board" viewBox="0 0 900 500" aria-label="Discover properties of distance">
<line id="whole" class="segment" visibility="hidden"></line><line id="leftPart" class="part-a" visibility="hidden"></line><line id="rightPart" class="part-b" visibility="hidden"></line>
<circle id="A" class="point a" r="22" visibility="hidden"></circle><circle id="B" class="point b" r="22" visibility="hidden"></circle><circle id="C" class="point c" r="20" visibility="hidden"></circle>
<text id="labelA" class="label la" visibility="hidden">A</text><text id="labelB" class="label lb" visibility="hidden">B</text><text id="labelC" class="label lc" visibility="hidden">C</text>
</svg>
<div id="instruction" class="instruction">Tap any two distinct points to place endpoints A and B.</div>
<div id="readout" class="readout">|AB| = —</div>
<div id="choices" class="choices"><button id="reverse">Explore reversing</button><button id="shrink">Explore shrinking</button><button id="partition">Explore partitioning</button></div>
<div id="result" class="result"></div>
<div class="actions"><button id="reset">Start again</button><button id="reveal">Show discoveries</button></div>
<div class="keywords"><span class="keyword">distance</span><span class="keyword">endpoint</span><span class="keyword">intermediate point</span><span class="keyword">line segment</span><span class="keyword">partition</span><span class="keyword">non-negative</span></div>
<a class="back-link" href="../axiom-one/">← Discover Axiom 1</a>
</section>
</main>
<script>
const svg=document.getElementById('board'),whole=document.getElementById('whole'),leftPart=document.getElementById('leftPart'),rightPart=document.getElementById('rightPart'),Ael=document.getElementById('A'),Bel=document.getElementById('B'),Cel=document.getElementById('C'),labelA=document.getElementById('labelA'),labelB=document.getElementById('labelB'),labelC=document.getElementById('labelC'),instruction=document.getElementById('instruction'),readout=document.getElementById('readout'),choices=document.getElementById('choices'),result=document.getElementById('result');
const reverseBtn=document.getElementById('reverse'),shrinkBtn=document.getElementById('shrink'),partitionBtn=document.getElementById('partition');
const W=900,H=500,M=36,SCALE=10;let stage=0,A=null,B=null,C=null,dragging=null,mode=null,done={reverse:false,shrink:false,partition:false};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),dist=(p,q)=>Math.hypot(q.x-p.x,q.y-p.y),value=n=>(n/SCALE).toFixed(1);
function pointer(e){const r=svg.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,M,W-M),y:clamp((e.clientY-r.top)*H/r.height,M,H-M)}}
function show(el,yes=true){el.setAttribute('visibility',yes?'visible':'hidden')}
function setPoint(el,label,p){el.setAttribute('cx',p.x);el.setAttribute('cy',p.y);label.setAttribute('x',p.x+20);label.setAttribute('y',p.y-18);show(el);show(label)}
function setLine(el,p,q){el.setAttribute('x1',p.x);el.setAttribute('y1',p.y);el.setAttribute('x2',q.x);el.setAttribute('y2',q.y);show(el)}
function project(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return{x:a.x,y:a.y};const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return{x:a.x+t*dx,y:a.y+t*dy}}
function update(){if(!A)return;setPoint(Ael,labelA,A);if(!B)return;setPoint(Bel,labelB,B);setLine(whole,A,B);const d=dist(A,B);readout.textContent=`|AB| = ${value(d)}`;readout.classList.add('visible');if(C){C=project(C,A,B);setPoint(Cel,labelC,C);setLine(leftPart,A,C);setLine(rightPart,C,B);const ac=dist(A,C),cb=dist(C,B);result.innerHTML=`|AC| + |CB| = <strong>${value(ac)} + ${value(cb)} = ${value(d)}</strong>`;result.classList.add('visible')}else{[Cel,labelC,leftPart,rightPart].forEach(el=>show(el,false))}if(mode==='shrink'&&d<8){done.shrink=true;shrinkBtn.classList.add('done');instruction.innerHTML='<strong>|AB| = 0.</strong> The smallest distance is zero. Distance is zero or positive: it is non-negative.'}}
svg.addEventListener('pointerdown',e=>{const p=pointer(e);if(stage===0){A=p;stage=1;instruction.textContent='Now tap a different point to place endpoint B.';update();return}if(stage===1){if(dist(A,p)<90){instruction.textContent='A and B must be distinct. Tap farther away.';return}B=p;stage=2;choices.classList.add('visible');instruction.textContent='Choose how you want to explore the distance.';update();return}if(mode==='partition'&&!C){C=project(p,A,B);done.partition=true;partitionBtn.classList.add('done');instruction.textContent='Drag green intermediate point C. Does the sum of the two parts always equal |AB|?';update();return}const items=[{n:'A',p:A},{n:'B',p:B}];if(C)items.push({n:'C',p:C});const target=items.sort((u,v)=>dist(p,u.p)-dist(p,v.p))[0];if(target&&dist(p,target.p)<55){dragging=target.n;svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{if(!dragging)return;const p=pointer(e);if(dragging==='A')A=p;if(dragging==='B')B=p;if(dragging==='C')C=project(p,A,B);update()});
function stop(e){dragging=null;try{svg.releasePointerCapture(e.pointerId)}catch{}}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
reverseBtn.addEventListener('click',()=>{const before=value(dist(A,B)),t=A;A=B;B=t;done.reverse=true;reverseBtn.classList.add('done');mode='reverse';update();result.innerHTML=`Distance before: <strong>${before}</strong><br>Distance after reversing: <strong>${value(dist(A,B))}</strong><br>Distance did not become negative.`;result.classList.add('visible');instruction.textContent='Reversing the endpoints does not change the distance.'});
shrinkBtn.addEventListener('click',()=>{mode='shrink';C=null;result.classList.remove('visible');instruction.textContent='Drag endpoint A or B towards the other until the segment collapses.';update()});
partitionBtn.addEventListener('click',()=>{mode='partition';if(dist(A,B)<80)B={x:Math.min(W-M,A.x+300),y:A.y};C=null;result.classList.remove('visible');instruction.textContent='Tap the line segment to place green intermediate point C.';update()});
document.getElementById('reveal').addEventListener('click',()=>{result.innerHTML='<strong>Distance is non-negative.</strong><br>|AB| = |BA|.<br>The smallest possible distance is 0.<br>If C lies between A and B, then |AC| + |CB| = |AB|.';result.classList.add('visible')});
document.getElementById('reset').addEventListener('click',()=>{stage=0;A=B=C=null;dragging=mode=null;done={reverse:false,shrink:false,partition:false};[Ael,Bel,Cel,labelA,labelB,labelC,whole,leftPart,rightPart].forEach(el=>show(el,false));readout.classList.remove('visible');choices.classList.remove('visible');result.classList.remove('visible');[reverseBtn,shrinkBtn,partitionBtn].forEach(b=>b.classList.remove('done'));instruction.textContent='Tap any two distinct points to place endpoints A and B.'});
</script>
</body>
</html>
