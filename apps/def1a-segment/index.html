<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definition 1A — Segment</title><style>:root{--blue:#1565c0;--red:#d32f2f;--ink:#1f2937;--bg:#f4f6f8;--green:#eef7ee;--green-border:#8fbf91}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:clamp(1.45rem,5vw,2rem);margin:6px 0 10px}.card{background:#fff;padding:14px;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08)}button{width:100%;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:800;background:#e6ebf1;margin-bottom:10px}.prompt{text-align:center;font-weight:850;margin:2px 0 10px}.notation{text-align:center;font-size:1.25rem;font-weight:900;margin:6px 0 10px}.board{width:min(100%,520px);aspect-ratio:1/1;margin:auto;display:block;background:#fff;border:2px solid #98a2b3;border-radius:12px;touch-action:none}.segment{stroke:#111827;stroke-width:5;stroke-linecap:round}.point{stroke:#fff;stroke-width:3;cursor:grab}.a{fill:var(--blue)}.b{fill:var(--red)}.label{font-size:24px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}.la{fill:var(--blue)}.lb{fill:var(--red)}.learn{display:none;margin-top:12px;padding:14px;text-align:center;background:var(--green);border:2px solid var(--green-border);border-radius:12px}.learn.show{display:block}.learn p{margin:8px 0;line-height:1.45}</style></head><body><main><h1>What is a line segment?</h1><section class="card"><button id="reset" type="button">Reset</button><p class="prompt">Drag A and B. Which part is the segment [AB]?</p><div class="notation">[AB]</div><svg id="board" class="board" viewBox="0 0 500 500" aria-label="A draggable line segment with endpoints A and B"><line id="segment" class="segment"/><circle id="a" class="point a" r="11"/><circle id="b" class="point b" r="11"/><text id="la" class="label la">A</text><text id="lb" class="label lb">B</text></svg><section id="learn" class="learn" aria-live="polite"><strong>Definition 1 — Segment ([AB])</strong><p>The line segment ([AB]) is the part of the line (AB) between (A) and (B), including the endpoints.</p></section></section></main><script>const board=document.getElementById('board'),A=document.getElementById('a'),B=document.getElementById('b'),LA=document.getElementById('la'),LB=document.getElementById('lb'),segment=document.getElementById('segment'),learn=document.getElementById('learn'),reset=document.getElementById('reset');let pA={x:145,y:155},pB={x:355,y:345},active=null,moves=0;const clamp=v=>Math.max(14,Math.min(486,v));function pointerPosition(e){const r=board.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*500/r.width),y:clamp((e.clientY-r.top)*500/r.height)}}function placeLabel(label,p){let dx=18,dy=-16;if(p.x>445)dx=-32;if(p.y<42)dy=30;if(p.y>460)dy=-18;label.setAttribute('x',p.x+dx);label.setAttribute('y',p.y+dy)}function draw(){A.setAttribute('cx',pA.x);A.setAttribute('cy',pA.y);B.setAttribute('cx',pB.x);B.setAttribute('cy',pB.y);placeLabel(LA,pA);placeLabel(LB,pB);segment.setAttribute('x1',pA.x);segment.setAttribute('y1',pA.y);segment.setAttribute('x2',pB.x);segment.setAttribute('y2',pB.y);if(moves>1)learn.classList.add('show')}function move(e){if(!active)return;const p=pointerPosition(e);if(active===A)pA=p;else pB=p;moves++;draw()}[A,B].forEach(point=>{point.addEventListener('pointerdown',e=>{active=point;point.setPointerCapture(e.pointerId);move(e)});point.addEventListener('pointermove',move);point.addEventListener('pointerup',()=>active=null);point.addEventListener('pointercancel',()=>active=null)});reset.addEventListener('click',()=>{pA={x:145,y:155};pB={x:355,y:345};moves=0;learn.classList.remove('show');draw()});draw()</script></body></html>
